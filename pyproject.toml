[project]
name = "mr-bench-review"
version = "1.0.0"
description = "Merge-request review benchmark: corpora, contract v1, validator and converters"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
