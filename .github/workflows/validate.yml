name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Fetch benchmark branches (commits and trees; blobs on demand)
        run: |
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --filter=blob:none --no-tags origin '+refs/heads/bench/*:refs/remotes/origin/bench/*'
      - run: uv run tools/validate.py --ref-prefix refs/remotes/origin/
